name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local.txt
      - name: Verify version
        shell: pwsh
        run: |
          python -c "import re; from version import __version__; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', __version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content VERSION).Trim()
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION' }
          }
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Install using the deployment entrypoint
        shell: pwsh
        run: |
          @"
          TRANSLATE_API_KEY=ci-placeholder
          TRANSLATE_BASE_URL=https://example.invalid/v1
          TRANSLATE_MODEL=qwen-mt-flash
          "@ | Set-Content -Encoding utf8 .env
          python deploy.py install
      - name: Unit and media integration tests
        run: .\.venv\Scripts\python.exe ci_tests.py
      - name: Web UI smoke test (isolated runner)
        run: .\.venv\Scripts\python.exe check_ui.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build source package and checksum
        shell: bash
        run: |
          version="$(cat VERSION | tr -d '\r\n')"
          mkdir -p dist
          git archive --format=zip --prefix="video-subtitle-${version}/" -o "dist/video-subtitle-${version}-windows-source.zip" HEAD
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
